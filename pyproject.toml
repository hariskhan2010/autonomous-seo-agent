[project]
name = "autonomous-seo-agent"
version = "0.1.0"
description = "An SEO operating system: evidence-first, deterministic tools + probabilistic intelligence, safety spine."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
  # API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # DB
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.6",
  # worker / bus
  "celery[redis]>=5.4",
  "redis>=5.2",
  # http / parsing (Tier 1 crawler, ported)
  "httpx>=0.28",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  # llm
  "anthropic>=0.40",
  "pyyaml>=6.0",
  "pyjwt>=2.10",
  "cryptography>=43.0",
  # observability
  "opentelemetry-sdk>=1.29",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-exporter-otlp>=1.29",
  "structlog>=24.4",
  "sentry-sdk>=2.19",
  # storage
  "boto3>=1.35",
  "temporalio>=1.32.0",
  "playwright>=1.62.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "mypy>=1.13",
  "ruff>=0.8",
  "schemathesis>=3.38",
  "types-beautifulsoup4",
  "types-pyyaml",
  "detect-secrets>=1.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["packages", "apps/api", "apps/worker"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages", "apps", "integrations", "mcp", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI markers are the framework-sanctioned way to declare dependencies.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header",
    "app.deps.require_role",
]

[tool.ruff.lint.per-file-ignores]
"database/migrations/*" = ["E501"]              # autogenerated column defs run long
"packages/db/models/*" = ["E501"]              # column DSL + inline enum comments run wide
"packages/db/rls.py" = ["S608", "E501"]        # DDL built from an in-code allow-list, not user input
"packages/seo_core/crawl/*" = ["E501"]         # dense parsing/guard logic
"packages/seo_core/technical/*" = ["E501"]     # check catalogue + engine rules
"packages/seo_core/keywords/*" = ["E501"]      # marker tables
"packages/seo_core/content/*" = ["E501"]
"integrations/serp/*" = ["E501"]
"integrations/analytics/*" = ["E501"]
"packages/seo_core/analytics/*" = ["E501"]
"packages/seo_core/geo/*" = ["E501"]
"integrations/ai_providers/*" = ["E501"]
"packages/knowledge_graph/*" = ["E501", "S608"]
"packages/opportunity_engine/*" = ["E501"]
"packages/planner/*" = ["E501"]
"packages/events/*" = ["E501"]
"apps/worker/worker/pipeline.py" = ["E501"]
"packages/rollback/*" = ["E501"]
"packages/verification/*" = ["E501"]
"packages/execution/*" = ["E501", "S603", "S607"]
"packages/tools/*" = ["E501"]
"apps/worker/worker/jobs/*" = ["E501"]
"apps/worker/worker/temporal/*" = ["E501"]
"apps/api/app/routers/*" = ["E501"]
"packages/reporting/*" = ["E501"]
"tests/*" = ["S105", "S106", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "packages:apps/api:apps/worker"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["celery.*", "pgvector.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# BeautifulSoup's element model is dynamic; strict attr checks fight it constantly.
module = ["seo_core.crawl.parser"]
disable_error_code = ["union-attr", "attr-defined", "index", "unused-ignore"]

[[tool.mypy.overrides]]
# presentation code over already-validated dicts
module = ["reporting.render"]
disable_error_code = ["index", "operator", "arg-type"]
