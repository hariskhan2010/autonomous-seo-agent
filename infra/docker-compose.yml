# Phase 0 dev stack. `docker compose -f infra/docker-compose.yml up -d db redis minio`
name: autonomous-seo-agent

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: seo
      POSTGRES_DB: seo
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo -d seo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Docker Hub's minio/minio now requires a login to pull; quay.io is MinIO's own still-public
    # mirror of the same image (found while actually standing up local infra, 2026-09-13).
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    env_file: [../.env]
    environment:
      PYTHONPATH: /app/packages:/app/apps/api:/app/apps/worker
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    profiles: ["full"]

  worker:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    # No `-Q` flag: consumes only the default `celery` queue, never `render` — `crawl.run_tier2`
    # is routed there (see worker/app.py's `task_routes`) precisely so it never lands on this
    # image, which has no browser at all.
    command: celery -A worker.app.celery_app worker -l INFO
    env_file: [../.env]
    environment:
      PYTHONPATH: /app/packages:/app/apps/api:/app/apps/worker
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
    profiles: ["full"]

  # Tier-2 headless-browser rendering (Phase 2/13) — the only service with Chromium; consumes
  # ONLY the `render` queue. Scale this independently from `worker` (browsers are far more
  # expensive per job than a plain HTTP fetch).
  worker-render:
    build: { context: .., dockerfile: infra/Dockerfile.playwright }
    env_file: [../.env]
    environment:
      PYTHONPATH: /app/packages:/app/apps/api:/app/apps/worker
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
    profiles: ["full"]

  # ADR-0003: the durable autonomous-loop workflow (Phase 11). Self-hosted dev instance — reuses
  # the `db` Postgres for its own schema (auto-setup creates it). Temporal Cloud replaces this +
  # `temporal-worker`'s TEMPORAL_ADDRESS override in prod (see NEEDED-KEYS.md).
  temporal:
    image: temporalio/auto-setup:1.24.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: seo
      POSTGRES_PWD: seo
      POSTGRES_SEEDS: db
    ports: ["7233:7233"]
    depends_on:
      db: { condition: service_healthy }
    profiles: ["full"]

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["8080:8080"]
    depends_on: [temporal]
    profiles: ["full"]

  temporal-worker:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    command: python -m worker.temporal.run_worker
    env_file: [../.env]
    environment:
      PYTHONPATH: /app/packages:/app/apps/api:/app/apps/worker
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal: { condition: service_started }
      db: { condition: service_healthy }
    profiles: ["full"]

volumes:
  pgdata:
  miniodata:
